name: Solana Demo-Day Rescue
description: Request a public scope review before sending SOL
title: "[RESCUE] Project name — deadline"
labels: ["demo-rescue"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private keys, credentials, confidential investor data, or unpublished source code. Do not pay until a public reply marks the scope **SCOPE ACCEPTED**.
  - type: input
    id: project
    attributes:
      label: Public project URL
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Demo or launch deadline
      placeholder: YYYY-MM-DD with timezone
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Audience and one-sentence product description
      description: Who must understand or buy this, and what changes for them?
    validations:
      required: true
  - type: textarea
    id: materials
    attributes:
      label: Public source materials
      description: Link the current site, public deck, demo, docs, brand assets, and repository if applicable.
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: What is unclear or underperforming today?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Scope confirmation
      options:
        - label: I understand this is a public, fixed-scope creative sprint and contains no tokenomics, smart-contract work, investment advice, or guaranteed outcome.
          required: true
        - label: I have not included secrets, credentials, private keys, or confidential materials.
          required: true
        - label: I will not send SOL until this issue is marked SCOPE ACCEPTED.
          required: true

