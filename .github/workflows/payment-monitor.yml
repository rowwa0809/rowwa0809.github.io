name: Payment and order monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    paths:
      - ".github/workflows/payment-monitor.yml"
      - "scripts/payment-monitor.mjs"

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/payment-monitor.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WALLET: AuZXoTMtSMrLM72nBhPzGeACz1udu8kLnZbTg8CiXhga
          START_AT: 2026-07-16T22:11:41Z
